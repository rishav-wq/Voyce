<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Voyce — Sales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
  <style>
/* Voyce app shell (same as the dashboard; gold-dash.css paints the sidebar) */
[hidden] { display: none !important; }   /* the page toggles with hidden; Voyce's .btn/.tabs set display */
.app-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; align-items: start; }
.sidebar { position: sticky; top: 0; height: 100vh; background: #ffffff; border-right: 1px solid #e4e7ec; padding: 22px 16px; display: flex; flex-direction: column; gap: 20px; }
.sidebar .logo { font-size: 20px; font-weight: 700; color: #16181d; display: flex; align-items: center; gap: 0; padding: 4px 8px; }
.sidebar .logo span { color: #24365e; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.side-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; font-size: 14px; font-weight: 600; color: #5b6270; cursor: pointer; border: none;
  background: none; width: 100%; text-align: left; text-decoration: none; transition: background .14s, color .14s; font-family: inherit; }
.side-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.side-spacer { flex: 1; }
.side-foot { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #e4e7ec; padding-top: 8px; }
.side-user { font-size: 12px; color: #98a0ae; padding: 0 12px 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { display: inline-flex; align-items: baseline; gap: 0; line-height: 1.35; }
.logo .logo-mark { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 500; font-size: 1.85em; line-height: 0.85;
  letter-spacing: -0.07em; background: none !important; border-radius: 0; width: auto !important; height: auto !important; display: inline !important; padding: 0; margin: 0 -0.02em 0 0; color: inherit; }
.dash-body { max-width: 1800px; margin: 0 auto; padding: 30px 32px; width: 100%; min-width: 0; }
@media (max-width: 860px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-right: none; border-bottom: 1px solid #e4e7ec; padding: 12px 16px; }
  .sidebar .side-spacer { display: none; }
  .side-nav { flex-direction: row; flex-wrap: wrap; }
  .side-foot { flex-direction: row; align-items: center; border-top: none; padding-top: 0; margin-left: auto; }
  .side-user { display: none; }
  .dash-body { padding: 20px 16px; }
}

/* Layout: a work queue. Today's follow-ups first, then the pipeline board, every lead, and the
   message scripts; a lead opens in a side panel with its next step and the message to send. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eef1f6; --fg: #16181d; --muted: #5b6270;
  --faint: #8a92a1; --line: #e1e5ec; --accent: #24365e; --accent-fg: #ffffff; --accent-soft: #e7ebf4;
  --ok: #057642; --ok-soft: #e3f3e8; --warn: #9a5b00; --warn-soft: #fbefd9; --bad: #b42318; --bad-soft: #fbe9e7;
  --scrim: rgba(22, 24, 29, .32); --shadow: 0 1px 2px rgba(22,24,29,.05), 0 16px 40px rgba(22,24,29,.14);
  --f-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-mark: 'Fraunces', Georgia, 'Times New Roman', serif;
}
*, *::before, *::after { box-sizing: border-box; }
.sales-wrap { color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.page-title { font-family: var(--f-display); font-size: 30px; font-weight: 700; color: var(--fg); margin: 0 0 4px; letter-spacing: -0.02em; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mark { font-family: var(--f-display); font-weight: 700; font-size: 22px; display: inline-flex; align-items: baseline; }
.mark i { font-family: var(--f-mark); font-style: italic; font-weight: 500; font-size: 1.7em; line-height: .8; letter-spacing: -0.06em; margin-right: -0.02em; }
.mark span.sales { color: var(--accent); margin-left: 8px; }
.sub { color: var(--muted); font-size: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); border-radius: 9px; padding: 8px 13px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.quiet:hover { color: var(--fg); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.neg { color: var(--bad); }
.toast-undo { margin-left: 10px; background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* summary */
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { display: inline-flex; align-items: baseline; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.chip-link { cursor: pointer; font: inherit; font-size: 13px; }
.chip-link:hover { border-color: var(--accent); color: var(--accent); }
.bad-num { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); font-size: 11.5px; font-weight: 600; font-family: inherit; }
.chip b { font-family: var(--f-display); font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.alert { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); background: var(--bad-soft); }
.chip.alert b { color: var(--bad); }

/* tabs */
.tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 500; margin-left: 4px; }
#main { margin-top: 18px; }
.banner { margin-top: 16px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }

/* sections + rows */
.section { margin-top: 22px; }
.section:first-child { margin-top: 0; }
.section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.section h3 .num { color: var(--faint); }
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.row.late { border-left: 3px solid var(--bad); }
.who { min-width: 0; cursor: pointer; }
.who .name { font-weight: 600; }
.prio { display: inline-block; min-width: 30px; margin-right: 7px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; vertical-align: 1px; }
.who .meta { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.who .next { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.g-Conversation { background: var(--warn-soft); color: var(--warn); }
.pill.g-Calls { background: var(--surface-2); color: var(--fg); }
.pill.g-Meeting, .pill.s-won { background: var(--ok-soft); color: var(--ok); }
.pill.s-lost { background: var(--surface-2); color: var(--faint); }
.due { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due.late { color: var(--bad); font-weight: 600; }
.due.today { color: var(--fg); font-weight: 600; }
.day { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty p { margin: 0 0 12px; max-width: 46ch; margin-inline: auto; }
@media (max-width: 620px) { .row { grid-template-columns: minmax(0, 1fr); } .acts { justify-content: flex-start; } }

/* board */
.board-scroll { overflow-x: auto; padding-bottom: 8px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: 210px; gap: 10px; }
.col { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 120px; }
.col h4 { margin: 0 0 8px; font-size: 12.5px; display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; }
.col h4 .num { color: var(--fg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 7px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card .name { font-weight: 600; font-size: 13px; }
.card .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.group-label { grid-column: span 1; }
@media (max-width: 700px) { .board { grid-auto-flow: row; grid-auto-columns: auto; } }

/* table */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters input, .filters select { padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.filters input { flex: 1 1 220px; min-width: 0; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
tr:last-child td { border-bottom: 0; }

/* scripts */
.scripts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.script { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.script h4 { margin: 0; font-family: var(--f-display); font-size: 15px; }
.script .when { font-size: 12px; color: var(--muted); }
.script pre { white-space: pre-wrap; font-family: var(--f-body); margin: 0; font-size: 13px; line-height: 1.55; background: var(--surface-2); padding: 10px 12px; border-radius: 9px; overflow-wrap: anywhere; }
.script textarea { width: 100%; min-height: 150px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); resize: vertical; line-height: 1.55; }
.script input { width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--faint); }

/* lead panel: a floating card from the sidebar's edge to the screen's edge */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.drawer { --dp-x: 28px; --dp-top: 22px; position: fixed; top: 14px; right: 14px; bottom: 14px; left: calc(248px + 14px);
  background: var(--surface); z-index: 21; border-radius: 16px; box-shadow: var(--shadow); overflow-y: auto;
  overscroll-behavior: contain;   /* scrolling the panel never scrolls the page behind it */
  padding: 0 var(--dp-x) 28px; }
@media (min-width: 861px) { .scrim { left: 248px; } }   /* the sidebar stays bright */
html.panel-open { overflow: hidden; }   /* on html only: overflow on body would make it the scroller and unstick the sidebar */
.scrim { overscroll-behavior: contain; touch-action: none; }
@media (max-width: 860px) { .drawer { --dp-x: 16px; top: 8px; right: 8px; bottom: 8px; left: 8px; border-radius: 14px; } }
.d-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
  position: sticky; top: 0; z-index: 2; background: var(--surface); margin: 0 calc(-1 * var(--dp-x)); padding: var(--dp-top) var(--dp-x) 14px;
  border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 22px; }
.icon-btn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; }
.d-body { display: grid; gap: 0 36px; padding-top: 6px; }
.d-col { min-width: 0; }
.d-col > .d-sec:first-child { border-top: 0; }
@media (min-width: 1100px) { .d-body { grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr); align-items: start; } }
.d-form { max-width: 780px; }
.d-head .meta { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.d-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.d-sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.d-sec > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; align-items: baseline; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd .row-btns { margin-top: 4px; }
.nextbox { background: var(--accent-soft); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.nextbox .what { font-weight: 600; }
.nextbox pre { white-space: pre-wrap; font-family: var(--f-body); margin: 0; font-size: 13.5px; line-height: 1.6; background: var(--surface); padding: 12px 14px; border-radius: 9px; overflow-wrap: anywhere; max-height: 360px; overflow-y: auto; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface); padding: 10px; border-radius: 10px; }
.inline-form input, .inline-form select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); flex: 1 1 180px; min-width: 0; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.hist li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; font-size: 12.5px; }
.hist time { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist .t { overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">V</span><span>oyce</span></div>
    <nav class="side-nav">
      <a class="side-item" href="/setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span>Queue</span></a>
      <a class="side-item" href="/tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4.5 13H11l-1 9 8.5-11H12z"/></svg><span>Write</span></a>
      <a class="side-item" href="/setup#profiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a>
      <a class="side-item active" href="/sales" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg><span>Sales</span></a>
    </nav>
    <div class="side-spacer"></div>
    <div class="side-foot">
      <span class="side-user" id="nav-user"></span>
      <a class="side-item" onclick="doAppLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></a>
    </div>
  </aside>
  <main class="dash-body">
    <div class="sales-wrap">
      <div class="top">
        <div>
          <h1 class="page-title">Sales</h1>
          <div class="sub">Cold calls to firm owners, and LinkedIn DMs with up to 3 follow-ups. Every lead ends in a booked meeting or a reason. Only the Voyce team can see this page.</div>
        </div>
        <button class="btn primary" id="add-lead" data-act="new" hidden>+ Add lead</button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="banner" id="banner" hidden></div>
      <nav class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-view="today" aria-selected="true">Today<span class="n" id="n-today"></span></button>
        <button class="tab" role="tab" data-view="pipeline" aria-selected="false">Pipeline</button>
        <button class="tab" role="tab" data-view="all" aria-selected="false">All leads<span class="n" id="n-all"></span></button>
        <button class="tab" role="tab" data-view="scripts" aria-selected="false">Scripts</button>
      </nav>
      <div id="main"><div class="empty"><p>Loading your leads…</p></div></div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim" hidden data-act="close"></div>
<aside class="drawer" id="drawer" hidden aria-label="Lead"></aside>
<div class="toast" id="s-toast" hidden role="status"></div>

<script>
const STAGES = [
  { key: "tocall", label: "To call", group: "Calls", track: "call" },
  { key: "try1", label: "No answer ×1", group: "Calls", track: "call" },
  { key: "try2", label: "No answer ×2", group: "Calls", track: "call" },
  { key: "try3", label: "No answer ×3", group: "Calls", track: "call" },
  { key: "spoke", label: "Spoke: interested", group: "Conversation", track: "call" },
  { key: "sample", label: "Sample sent", group: "Conversation", track: "call" },
  { key: "new", label: "To DM", group: "Outreach", track: "dm" },
  { key: "dm", label: "DM sent", group: "Outreach", track: "dm" },
  { key: "fu1", label: "Follow-up 1", group: "Outreach", track: "dm" },
  { key: "fu2", label: "Follow-up 2", group: "Outreach", track: "dm" },
  { key: "fu3", label: "Follow-up 3", group: "Outreach", track: "dm" },
  { key: "replied", label: "Replied", group: "Conversation", track: "dm" },
  { key: "number", label: "Number shared", group: "Conversation", track: "dm" },
  { key: "called", label: "Called", group: "Conversation", track: "dm" },
  { key: "meeting", label: "Meeting booked", group: "Meeting", track: "both" },
  { key: "won", label: "Won", group: "Closed", track: "both" },

let toastTimer = null;
function toast(msg, undo) {
  const t = $("#s-toast"); t.textContent = msg;
  if (undo) { const b = document.createElement("button"); b.className = "toast-undo"; b.textContent = "Undo";
    b.onclick = () => { t.hidden = true; clearTimeout(toastTimer); undo(); }; t.append(" ", b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 7000 : 2600);
}
function copy(text, done = "Copied") {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); toast(ok ? done : "Couldn't copy. Select the text and copy it yourself."); };
  try { navigator.clipboard.writeText(text).then(() => toast(done), fallback); } catch (_) { fallback(); }
}

/* ── events ── */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "new") { if (!canWrite) return; openId = "new"; panel = null; dupMatch = null; renderDrawer(); }
  else if (act === "close") closeDrawer();
  else if (act === "show-notint") { view = "all"; filters.stage = "notint"; filters.q = ""; renderSummary(); renderMain(); }
  else if (act === "show-wrongnum") { view = "all"; filters.stage = "wrongnum"; filters.q = ""; renderSummary(); renderMain(); }
  else if (act === "open") openLead(id);
  else if (act === "open-panel") openLead(id, el.dataset.panel);
  else if (act === "set-panel") { panel = el.dataset.panel || null; renderDrawer(); }
  else if (act === "action") { await runAction(id, el.dataset.a); }
  else if (act === "take") { await patchLead(id, { owner: "me" }, "Took over this lead"); }
  else if (act === "delete") { if (await safe(() => api("DELETE", `/sales/leads/${encodeURIComponent(id)}`), "Lead deleted")) { leads = leads.filter(x => x.id !== id); closeDrawer(); renderAll(); } }
  else if (act === "copy-msg") { copy($("#msg")?.textContent || "", "Message copied"); }
  else if (act === "copy-text") { copy(el.dataset.text || "", "Copied"); }
  else if (act === "track") { pipeTrack = el.dataset.t === "dm" ? "dm" : "call"; renderMain(); try { localStorage.setItem("vs-track", pipeTrack); } catch (_) {} }
  else if (act === "lookup") { await doLookup(id, el); }
  else if (act === "enrich") { await doEnrich(el); }
  else if (act === "reveal") { await doReveal(id, el); }
  else if (act === "to-call") { await save(id, { stage: "tocall", next_due: today() }, "Moved to the call list", "Moved to the call list"); }
  else if (act === "copy-script") { const s = scripts[+el.dataset.i]; if (s) copy(s.body, "Script copied"); }
  else if (act === "add-anyway") { dupMatch = { forced: true }; $("#new-form")?.requestSubmit(); }
  else if (act === "script-edit") { editingScript = +el.dataset.i; renderMain(); }
  else if (act === "script-cancel") { editingScript = null; scripts = scripts.filter(s => s.title !== "New script" || s.body); renderMain(); }
  else if (act === "script-add") { scripts = scripts.concat([{ key: "custom-" + Date.now().toString(36), title: "New script", when: "", body: "" }]); editingScript = scripts.length - 1; renderMain(); }
  else if (act === "script-save" || act === "script-del") {
    const i = +el.dataset.i; let items = scripts.map(s => ({ ...s }));
    if (act === "script-del") items.splice(i, 1);
    else items[i] = { ...items[i], title: $("#s-title").value.trim() || "Untitled", when: $("#s-when").value.trim(), body: $("#s-body").value };
    editingScript = null;
    const out = await safe(() => api("PUT", "/sales/scripts", { items }), act === "script-del" ? "Script deleted" : "Script saved");
    if (out && out.items) scripts = out.items;
    renderAll();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openId !== null) closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return; view = t.dataset.view; editingScript = null; renderSummary(); renderMain();
  try { localStorage.setItem("vs-view", view); } catch (_) {}
});
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { filters.q = e.target.value; const pos = e.target.selectionStart; renderMain(); const q = $("#f-q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} } }
});
document.addEventListener("change", async e => {
  if (e.target.id === "f-stage") { filters.stage = e.target.value; renderMain(); }
  else if (e.target.id === "f-owner") { filters.owner = e.target.value; renderMain(); }
  else if (e.target.id === "d-due" && openId && e.target.value) { await patchLead(openId, { next_due: e.target.value }, `Next date set to ${fmtDay(e.target.value)}`); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "new-form") {
    const v = readDetails(); if (!v.name) { $("#l-name").focus(); return; }
    if (!(dupMatch && dupMatch.forced)) {
      const li = normLi(v.linkedin);
      const hit = leads.find(l => (li && normLi(l.linkedin) === li) || (l.name.toLowerCase() === v.name.toLowerCase() && (l.company || "").toLowerCase() === v.company.toLowerCase()));
      if (hit) { const keep = readDetails(); dupMatch = hit; renderDrawer(); Object.entries({ "l-name": keep.name, "l-role": keep.role, "l-company": keep.company, "l-city": keep.city, "l-linkedin": keep.linkedin, "l-phone": keep.phone, "l-firm-phone": keep.firm_phone, "l-email": keep.email }).forEach(([k, val]) => { const x = $("#" + k); if (x) x.value = val; }); return; }
    }
    const stage = $("#l-stage")?.value || "new", t = today();
    const fields = { ...v, stage, dm_at: stage === "dm" || stage === "replied" ? t : "", next_due: stage === "dm" ? addDays(t, 3) : t };
    const note = { new: "Added", tocall: "Added to the call list", dm: "Added (first DM already sent)", replied: "Added (they've replied)" }[stage] || "Added";
    const doc = await safe(() => api("POST", "/sales/leads", { fields, note }), `${v.name} added`);
    if (doc && doc.id) { putLead(doc); renderAll(); openLead(doc.id); }
  } else if (f.id === "edit-form") {
    const v = readDetails(); if (!v.name) return;
    if (await patchLead(openId, v, "Edited details")) toast("Details saved");
  } else if (f.id === "touch-form") {
    const txt = $("#t-text").value.trim(); if (!txt) return;
    const ok = await save(openId, {}, `${$("#t-ch").value}: ${txt}`, "Logged");
    if (ok) { $("#t-text").value = ""; document.activeElement?.blur(); renderDrawer(); }
  } else if (f.id === "p-number") {
    const ph = $("#p-phone").value.trim(); if (digits(ph).length < 8) { toast("Enter the full number, with the country code if it isn't Indian."); return; }
    await runAction(openId, "number", { phone: ph });
  } else if (f.id === "p-meeting") {
    const w = $("#p-when").value; if (!w) return; await runAction(openId, "meeting", { meeting_at: w });
  } else if (f.id === "p-callback") {
    const dt = $("#p-date").value; if (!dt) return; await runAction(openId, "callback", { date: dt });
  } else if (f.id === "p-lost") {
    await runAction(openId, "lost", { reason: $("#p-reason").value });
  }
});
